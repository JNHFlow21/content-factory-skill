# 内容风格（干货/故事/情绪/热点/测评）
content_style: "干货+实战案例"

# 禁忌
blacklist:
  words: ["震惊", "必看", "不转不是中国人", "赶紧收藏", "小白必学", "轻松学会"]
  topics: ["政治敏感", "宗教", "色情", "赌博"]

# 参考账号风格
reference_accounts:
  - "群响刘老板"
  - "老马的商业笔记"

# 排版
theme: "professional-clean"

# 封面
cover_style: "简洁专业，蓝色/深灰色调，扁平化设计，突出AI/自动化/效率主题"

# 署名
author: "AI杰瑞斯"
