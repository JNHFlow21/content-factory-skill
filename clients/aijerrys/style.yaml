# 客户配置 — AI杰瑞斯

name: "AI杰瑞斯"
industry: "AI服务/企业培训"
target_audience: "企业主、创业者、管理者、有AI需求的职场人"

# 内容方向
topics:
  - AI智能体/Agent开发
  - 企业AI自动化工作流
  - AI提效实战案例
